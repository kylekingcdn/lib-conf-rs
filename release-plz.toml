# Base config sourced from axum's sane defaults: https://github.com/tokio-rs/axum/blob/main/release-plz.toml
#
[workspace]
# Temporarily disable release handling for all (covering examples)
release = false

# Only release when the release PR is merged, not on every commit
# https://release-plz.dev/docs/config#the-release_always-field
release_always = false

# Label release PRs for easy identification
# https://release-plz.dev/docs/config#the-pr_labels-field
pr_labels = ["release"]

# Disable GitHub tag generation by default (enable on a per-package basis)
git_tag_enable = false

# Disable changelogs by default (enable on a per-package basis)
changelog_update = false

# Disable GitHub release generation
git_release_enable = false

# Organize release branches in hierarchy
pr_branch_prefix = "release-plz/"

[[package]]
name = "lib-conf"
changelog_include = ["lib-conf-derive"]
release = true
git_tag_enable = true
changelog_update = true
version_group = "core"

[[package]]
name = "lib-conf-derive"
release = true
git_tag_enable = true
changelog_update = true
version_group = "core"

[[package]]
name = "lib-conf-traits"
release = true
git_tag_enable = true
changelog_update = true
version_group = "traits"

[[package]]
name = "lib-conf-ports"
release = true
git_tag_enable = true
changelog_update = true
version_group = "ports"

# [[package]]
# name = "lib-conf-nested-tests"
# release = false
#
# [[package]]
# name = "lib-conf-example-00"
# release = false

[changelog]
protect_breaking_commits = true
commit_parsers = [
  { message = "^build\\(deps\\)", skip = true },
  { message = "^ci[(:]", skip = true },
  { message = "^style[(:]", skip = true },
  { message = "^refactor\\(clippy\\)", skip = true },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
]
