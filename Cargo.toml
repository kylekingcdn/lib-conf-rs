[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/kylekingcdn/lib-conf-rs"
license = "MIT"
publish = false

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
match_bool = "allow"
single_match_else = "allow"
