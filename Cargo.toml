[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/*/bin*",
    "examples/*/lib",
    "examples/readme",
    "tests/nested-test-cases",
]
exclude = [
    # excluded due to feature unification
    "examples/2-serde-optional/bin-no-serde",
    "tests/nested-expanded",
]

[workspace.package]
description = "Proc-macro providing library authors with first-class configuration for their end-users"
version = "0.5.0-rc.1"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/kylekingcdn/lib-conf-rs"
license = "MIT"
publish = false

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
arbitrait = { version = "0.0.5", default-features = false }
config = { version = "0.15.25", default-features = false }
dotenvy = { version = "0.15.7", default-features = false }
lib-conf = { version = "0.5.0-rc.1", default-features = false, path = "crates/lib-conf" }
lib-conf-derive = { version = "0.5.0-rc.1", default-features = false, path = "crates/lib-conf-derive" }
lib-conf-traits = { version = "0.0.1", default-features = false, path = "crates/lib-conf-traits" }
log = { version = "0.4.18", default-features = false }
prettyplease = { version = "0.3.0", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
serde = { version = "1.0.229", default-features = false }
secrecy = { version = "0.10.3", default-features = false }
sqlx = { version = "0.8.6", default-features = false }
static_assertions = { version = "1.1.0", default-features = false }
syn = { version = "3.0.4", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
tracing = { version = "0.1.44", default-features = false }
url = { version = "2.5.8", default-features = false }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
bool_assert_comparison = "allow"
match_bool = "allow"
single_match_else = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
duplicated_attributes = "warn"

[workspace.lints.cargo]
pedantic = { level = "warn", priority = -1 }

[workspace.metadata.bacon.keybindings]
d = "job:docs-rs"
g = "job:expand-gen"
e = "job:expand-build"

[workspace.metadata.bacon.jobs.docs-rs]
command = ["cargo", "+nightly", "docs-rs", "-p", "lib-conf"]
extraneous_args = false
background = true

[workspace.metadata.bacon.jobs.expand-gen]
command = ["cargo", "check"]
workdir = "./tests/nested-test-cases"
background = true
default_watch = false
watch = ["./tests/nested-test-cases/src"]

[workspace.metadata.bacon.jobs.expand-build]
command = ["cargo", "check"]
workdir = "./tests/nested-expanded"
background = true
default_watch = false
watch = ["./tests/nested-expanded/src"]
