[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
description = "Proc-macro providing library authors with first-class configuration for their end-users"
version = "0.1.0-pre2"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/kylekingcdn/lib-conf-rs"
license = "MIT"
publish = false

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
lib-conf-derive = { version = "0.1.0-pre1", path = "crates/lib-conf-derive" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
match_bool = "allow"
single_match_else = "allow"
