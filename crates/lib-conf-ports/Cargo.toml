[package]
name = "lib-conf-ports"
description = "`lib-conf` implementations for 3rd party crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = true

[lints]
workspace = true

[features]
# feature groups
default = []
# base deps shared when 1 or more ports are enabled
_enable =  [
    "dep:lib-conf", "lib-conf?/derive",
    "dep:serde", "lib-conf?/serde", "log?/serde", "secrecy?/serde",
]
# feature flags
"derive-expand" = ["lib-conf?/derive-expand"]

# module gates
sqlx-postgres = [
    "_enable",
    "lib-conf?/adapter",
    "dep:sqlx", "sqlx?/postgres",
    "dep:log",
    "dep:secrecy",
]

[dependencies]
lib-conf = { workspace = true, optional = true  }
log = { workspace = true, optional = true, features = ["serde"] }
secrecy = { workspace = true, optional = true, features = ["serde"] }
serde = { workspace = true, optional = true, features = ["derive"] }
sqlx = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
