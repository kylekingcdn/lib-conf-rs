name: Test

on:
  push:
    branches:
      - main
      - master
      - feature/**
      - release-plz/*
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Code [default features]
        run: cargo test --workspace --all-targets
      - name: Code [all features]
        run: cargo test --workspace --all-targets --all-features

      - name: Docs [default features]
        run: cargo test --workspace --doc
      - name: Docs [all features]
        run: cargo test --workspace --doc --all-features

      - name: Run examples
        shell: bash
        run: |
          for BIN_TOML in examples/*/*bin*/Cargo.toml; do
          BIN="$(dirname "${BIN_TOML}")"
          (
            cd "${BIN}"

            NAME="${BIN/examples\//}";
            echo -e "\n\e[1;95m Running example\e[0m - \e[49;36m${NAME}\e[0m\n";

            if [[ "${BIN}" != *'-no-serde'* ]]; then
                _RUN_ARGS='--all-features'
            fi;
            cargo run "${_RUN_ARGS}"
          )
          done;

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *install-rust

      - name: Clippy [default features]
        run: cargo clippy --workspace --all-targets
      - name: Clippy [all features]
        run: cargo clippy --workspace --all-targets --all-features
